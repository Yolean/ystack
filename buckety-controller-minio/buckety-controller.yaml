backends:

- name: cluster-kafka
  driver: kadm
  config:
    seedBrokers:
    - y-bootstrap.kafka.svc.cluster.local:9092
    clientID: buckety-controller
  defaults:
    zone: local

- name: cluster-objects
  driver: s3
  config:
    implementation: minio
    endpoint: http://y-s3-api.blobs.svc.cluster.local:9000
    region: us-east-1
    forcePathStyle: true
    # Root credentials are sourced from env vars the controller
    # Deployment populates from the local-copy minio-creds Secret
    # (see kustomization.yaml's secretGenerator and
    # deployment-patch.yaml).
    accessKeyID:     ${MINIO_ROOT_ACCESSKEY}
    secretAccessKey: ${MINIO_ROOT_SECRETKEY}
  defaults:
    zone: local
