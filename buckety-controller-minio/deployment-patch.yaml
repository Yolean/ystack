apiVersion: apps/v1
kind: Deployment
metadata:
  name: buckety-controller
spec:
  template:
    spec:
      containers:
      - name: controller
        args:
        - "-c"
        - "/etc/buckety"
        - "--enable-webhook=false"
        env:
        - name: MINIO_ROOT_ACCESSKEY
          valueFrom:
            secretKeyRef: {name: minio-creds, key: accesskey}
        - name: MINIO_ROOT_SECRETKEY
          valueFrom:
            secretKeyRef: {name: minio-creds, key: secretkey}
