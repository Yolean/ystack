# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buckety
resources:
- namespace.yaml
- ../buckety-controller/upstream/crd
- ../buckety-controller/upstream/controller
secretGenerator:
- name: buckety-controller-config
  files:
  - buckety-controller.yaml
# Local copy of MinIO root creds for the s3 backend. Same example
# values as blobs-minio/defaultsecret/ -- the `minio` Secret is in
# the blobs namespace and Secrets don't cross namespaces; the
# controller Pod needs these as env vars at startup for envsubst on
# the s3 backend config. Consumers that override the MinIO root
# credentials must override both Secrets in lockstep.
- name: minio-creds
  literals:
  - accesskey=YstackEXAMPLEKEY
  - secretkey=github.com/Yolean/ystack-EXAMPLE
patches:
- path: clusterrolebinding-patch.yaml
- path: deployment-patch.yaml
