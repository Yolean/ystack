apiVersion: buckety.yolean.se/v1alpha1
kind: Buckety
metadata:
  name: validate-ystack
spec:
  backend: acceptance-validation-stream
  # Topic name is operator-chosen; the validate-ystack script
  # hardcodes "y-cluster-validate-ystack", so the Buckety pins
  # it explicitly here rather than defaulting to metadata.name.
  name: y-cluster-validate-ystack
  parameters:
    partitions: "1"
  retentionPolicy: Delete
  defaultAccess:
    role: ReadWrite
    credentialsSecretName: topic-validate-ystack
