apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  template:
    metadata:
      annotations:
        # Admin API, the same endpoint a PodMonitor would use. /public_metrics
        # is the smaller, stable set; /metrics on the same port is the internal one.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9644"
        prometheus.io/path: /public_metrics
