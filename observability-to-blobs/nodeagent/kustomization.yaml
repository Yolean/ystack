# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The node agent: a DaemonSet in namespace observability (which this base creates) that uploads the
# node's logs, journal and metrics to S3. The bucket and the credentials are the overlay's (README.md).
# The ref is the same in every base here; README.md, "Ref".
resources:
- https://github.com/Yolean/observability-to-blobs/agent?ref=1170b7abf704d633315a230c9125b337fe54401a

components:
- ../nodeagent-image
- ../cluster-name
