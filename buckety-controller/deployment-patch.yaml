apiVersion: apps/v1
kind: Deployment
metadata:
  name: buckety-controller
spec:
  template:
    spec:
      containers:
      - name: controller
        # ystack has no cert-manager; disable the webhook server.
        # Per-driver parameter validation moves to the reconcile
        # loop and surfaces on Buckety.status.conditions.
        # See buckety-controller PR #3 / commit cb45545.
        args:
        - "-c"
        - "/etc/buckety"
        - "--enable-webhook=false"
        env:
        # Sourced for the s3 backend's envsubst:"true" fields in
        # buckety-controller.yaml. See secretGenerator
        # versitygw-creds in kustomization.yaml.
        - name: VERSITYGW_ROOT_ACCESSKEY
          valueFrom:
            secretKeyRef: {name: versitygw-creds, key: root-accesskey}
        - name: VERSITYGW_ROOT_SECRETKEY
          valueFrom:
            secretKeyRef: {name: versitygw-creds, key: root-secretkey}
