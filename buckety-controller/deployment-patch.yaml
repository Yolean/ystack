apiVersion: apps/v1
kind: Deployment
metadata:
  name: buckety-controller
spec:
  template:
    spec:
      containers:
      - name: controller
        # args are NOT patched: the base already passes -c /etc/buckety, and
        # the webhook runs with the certgen-minted cert that
        # release-tls-selfsigned provides. The base mounts that Secret
        # optional:true, so the Pod starts before the Jobs finish and picks
        # the cert up when it lands.
        env:
        # Sourced for the s3 backend's envsubst:"true" fields in
        # buckety-controller.yaml. See secretGenerator
        # versitygw-creds in kustomization.yaml.
        - name: VERSITYGW_ROOT_ACCESSKEY
          valueFrom:
            secretKeyRef: {name: versitygw-creds, key: root-accesskey}
        - name: VERSITYGW_ROOT_SECRETKEY
          valueFrom:
            secretKeyRef: {name: versitygw-creds, key: root-secretkey}
